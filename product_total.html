<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul id="cart-products">
        <li>
            <input type="checkbox" class="select-product">
            <span class="product-price">450</span>
        </li>
        <li>
            <input type="checkbox" class="select-product">
            <span class="product-price">390</span>
        </li>
        <li>
            <input type="checkbox" class="select-product">
            <span class="product-price">1000</span>
        </li>
        <li>
            <input type="checkbox" class="select-product">
            <span class="product-price">50</span>
        </li>
    </ul>

    <h1>Total : <span class="total-amount">0</span></h1>


    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function () {

            function calculateTotal() {
                let sum = 0;

                $("#cart-products li").each(function () {
                    let checkbox = $(this).find(".select-product");
                    let price = parseFloat($(this).find(".product-price").text()) || 0;

                    if (checkbox.is(":checked")) {
                        sum += price;
                    }
                });

                $(".total-amount").text(sum);
            }

            // Recalculate when any checkbox is clicked
            $(".select-product").on("change", function () {
                calculateTotal();
            });

        });

    </script>
</body>

</html>
