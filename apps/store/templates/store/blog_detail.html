{% extends 'store/base.html' %}

{% block title %}
{{ blog.title }}
{% endblock %}

{% block body %}

<!-- Blog Detail -->
<section class="bg-gray-50 py-20">
  <div class="container mx-auto px-6 max-w-5xl pt-5">

    <!-- Category & Date -->
    <div class="flex items-center gap-3 text-sm text-gray-500 mb-4">
      <span class="bg-yellow-500 text-dark px-3 py-1 rounded-full text-xs font-medium">
        {{ blog.category.name }}
      </span>
      <span class="flex items-center gap-1">
        <i class="fa-regular fa-calendar"></i>
        {{ blog.created_at|date:"d F Y" }}
      </span>
    </div>

    <!-- Title -->
    <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-6 leading-tight">
      {{ blog.title }}
    </h1>

    <!-- Image -->
    <div class="rounded-2xl overflow-hidden shadow-lg mb-10">
      <img src="{{ blog.image.url }}" alt="{{ blog.title }}"
           class="w-full h-[420px] object-cover">
    </div>

    <!-- Content -->
    <article class="prose prose-lg max-w-none text-gray-700 leading-relaxed">
      {{ blog.content|linebreaks }}
    </article>

    <!-- Divider -->
    <div class="border-t border-gray-200 my-12"></div>

    <!-- Back Button -->
    <div class="flex justify-between items-center">
      <a href="{% url 'blogs' %}"
         class="inline-flex items-center gap-2 text-yellow-600 font-medium hover:underline">
        ← Back to Blogs
      </a>

      <span class="text-sm text-gray-400">
        Published on {{ blog.created_at|date:"d F Y" }}
      </span>
    </div>

  </div>
</section>

{% endblock %}
