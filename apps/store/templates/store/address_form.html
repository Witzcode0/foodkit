{% extends "store/base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block body %}
<div class="max-w-xl mx-auto py-16 px-6">

  <h2 class="text-2xl font-bold mb-6">{{ title }}</h2>

  <form method="post" class="space-y-4 bg-white p-6 rounded-xl shadow">
    {% csrf_token %}

    {{ form.non_field_errors }}

    {% for field in form %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          {{ field.label }}
        </label>

        {{ field }}

        {% if field.errors %}
          <p class="text-sm text-red-600 mt-1">{{ field.errors.0 }}</p>
        {% endif %}
      </div>
    {% endfor %}

    <div class="flex items-center gap-2">
      {{ form.is_primary }}
      <label class="text-sm text-gray-700">Set as primary address</label>
    </div>

    <button type="submit"
      class="w-full bg-yellow-600 hover:bg-yellow-700 text-white py-3 rounded-lg font-semibold">
      Save Address
    </button>
  </form>

</div>
{% endblock %}
